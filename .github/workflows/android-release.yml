name: Android Release Build (Option C Hybrid)

on:
  push:
    branches: [arena/01a042df-t2s, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (Option C Hybrid — CI compilation)
        run: |
          if [ -f "gradlew" ] && [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew :app:assembleRelease
          else
            apt-get update -qq && apt-get install -y -qq gradle
            gradle :app:assembleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piper-tts-option-c-release
          path: app/build/outputs/apk/release/*.apk
